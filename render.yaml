databases:
  - name: tiny-tale-db
    plan: free
    databaseName: tiny_tale
    user: tiny_tale
services:
  - type: web
    name: tiny-tale-store
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /health
    envVars:
      - key: APP_ROLE
        value: store
      - key: DATABASE_URL
        fromDatabase:
          name: tiny-tale-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.8
  - type: web
    name: tiny-tale-admin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /health
    envVars:
      - key: APP_ROLE
        value: admin
      - key: DATABASE_URL
        fromDatabase:
          name: tiny-tale-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.8
